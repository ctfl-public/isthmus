[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "isthmus"
version = "0.1.0"
description = "Python bindings for the ISTHMUS marching-windows library"
readme = "python/README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
keywords = [
    "marching windows",
    "voxel",
    "surface reconstruction",
    "isosurface",
    "FSI",
    "multiphysics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[tool.scikit-build]
# Pass flags to the CMake configure step.
cmake.args = ["-DISTHMUS_BUILD_PYTHON=ON", "-DISTHMUS_BUILD_TESTS=OFF"]

# Tell scikit-build-core where the pure-Python package sources live.
# The compiled extension (_isthmus.so) is placed by CMake install into
# the `isthmus/` sub-directory of the wheel, matching this layout.
wheel.packages = ["python/isthmus"]

# Minimum CMake version required (matches the project requirement).
cmake.minimum-version = "3.14"
